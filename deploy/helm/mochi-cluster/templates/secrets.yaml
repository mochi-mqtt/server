{{- if and (not (include "mochi.useAuthFile" .)) (not .Values.auth.allowAll) }}
{{- fail "set auth.existingSecret or auth.ledger, or auth.allowAll=true for testing" }}
{{- end }}
{{- if and .Values.tls.enabled (not .Values.tls.secretName) }}
{{- fail "tls.enabled needs tls.secretName" }}
{{- end }}
{{- if not (or .Values.plainMQTT.enabled .Values.tls.enabled .Values.websocket.enabled) }}
{{- fail "enable at least one of plainMQTT, tls or websocket" }}
{{- end }}
{{- if and .Values.auth.ledger (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mochi.authSecret" . }}
  labels: {{- include "mochi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: |
    {{- toYaml .Values.auth.ledger | nindent 4 }}
{{- end }}
{{- if and .Values.cluster.gossipKey.create (not .Values.cluster.gossipKey.existingSecret) }}
{{- $name := include "mochi.gossipSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "mochi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # nodes with different keys can't gossip
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.cluster.gossipKey.secretKey) }}
  {{ .Values.cluster.gossipKey.secretKey }}: {{ index $existing.data .Values.cluster.gossipKey.secretKey }}
  {{- else }}
  {{ .Values.cluster.gossipKey.secretKey }}: {{ randAscii 32 | b64enc | b64enc }}
  {{- end }}
{{- end }}
